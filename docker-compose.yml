# Ichor local stack: MinIO (S3-compatible object storage) + HydraDB.
#
# WHY MinIO AND NOT `CLOUD_PROVIDER=local`:
#   HydraDB's documented `CLOUD_PROVIDER=local` mode cannot sustain writes —
#   manifest GC fails permanently (open issue on hydra-db/hydradb, 2026-08-14).
#   S3-compatible storage is the supported write path.
#
# WHY `CLOUD_PROVIDER=aws` WHEN THERE IS NO AWS HERE:
#   Straight from HydraDB's own benchmark harness:
#     "CLOUD_PROVIDER=aws selects the S3 protocol, not Amazon.
#      AWS_ENDPOINT points it at MinIO."
#
#   Start:  docker compose up -d
#   Verify: npm run smoke      <- a listening port is not proof; a round-tripped write is
#   Stop:   docker compose down          (add -v to also wipe the graph)

services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: ichor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ichor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ichor-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console, handy for seeing the graph exists on disk
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # HydraDB expects the bucket to already exist. This runs once and exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ichor-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ichor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ichor-dev-secret}
      ICHOR_BUCKET: ${ICHOR_BUCKET:-ichor}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$ICHOR_BUCKET &&
      echo 'bucket ready: '$$ICHOR_BUCKET
      "

  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: ichor-hydradb
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # --- storage: S3 protocol, pointed at MinIO ---
      CLOUD_PROVIDER: aws
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ichor}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-ichor-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_BUCKET: ${ICHOR_BUCKET:-ichor}
      # Both of these are REQUIRED for MinIO and appear only in HydraDB's
      # benchmark harness, not in its README. Without them the node starts,
      # listens on 7687, and every object-store operation fails with
      # "object store list/put failed" — a healthy-looking but dead node.
      #   AWS_ALLOW_HTTP           Rust's object_store refuses a plaintext
      #                            endpoint unless this is set.
      #   ..VIRTUAL_HOSTED_STYLE.. MinIO needs path-style (endpoint/bucket),
      #                            not virtual-host style (bucket.endpoint).
      AWS_ALLOW_HTTP: "true"
      AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"

      # --- graph identity / topology (single dev node) ---
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=0.0.0.0:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687

      # --- local disposable state ---
      GRAPH_DATA_CACHE_DIR: /cache
      GRAPH_AUTH_TOKEN_FILE: /run/secrets/hydradb-auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"   # dev only — TLS is required in real deployments
      RUST_MIN_STACK: "33554432"
    ports:
      - "127.0.0.1:7687:7687"   # Bolt   <- this is the one we use
      - "127.0.0.1:8443:8443"   # HTTP query API
      - "127.0.0.1:9090:9090"   # metrics
    volumes:
      - hydradb-cache:/cache
      - ./docker/hydradb-auth-token:/run/secrets/hydradb-auth-token:ro

volumes:
  minio-data:
  hydradb-cache:
